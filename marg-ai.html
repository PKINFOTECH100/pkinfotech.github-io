<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YouTube Help - MARG ERP</title>
<link rel="icon" type="image/png" href="marglogo.png">

<style>
body {
    font-family: Arial, sans-serif;
    background: #f5f7fa;
    margin: 0;
    padding: 20px;
}

.container {
    max-width: 700px;
    margin: 50px auto;
    background: #ffffff;
    padding: 30px;
    border-radius: 15px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.1);
}

h1 {
    text-align: center;
    color: #003366;
    margin-bottom: 25px;
}

textarea {
    width: 100%;
    height: 120px;
    padding: 15px;
    font-size: 18px;
    border: 2px solid #d0d0d0;
    border-radius: 10px;
    box-sizing: border-box;
}

button {
    width: 100%;
    margin-top: 15px;
    padding: 15px;
    font-size: 20px;
    background: #0d6efd;
    color: white;
    border: none;
    border-radius: 10px;
    cursor: pointer;
}

button:hover {
    background: #0b5ed7;
}

.note {
    margin-top: 15px;
    text-align: center;
    color: #666;
    font-size: 14px;
}

/* Popup */
#popup {
    display: none;
    position: fixed;
    top: 50%;
    left: 50%;
    width: 80%;
    max-width: 900px;
    height: 70%;
    transform: translate(-50%, -50%);
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    z-index: 9999;
    overflow: hidden;
}

.popup-header {
    background: #003366;
    color: #fff;
    padding: 10px;
    display: flex;
    justify-content: flex-end;
    gap: 10px;
}

.popup-header button {
    width: auto;
    margin: 0;
    padding: 6px 12px;
    font-size: 16px;
    border-radius: 6px;
}

#videoFrame {
    width: 100%;
    height: calc(100% - 50px);
    border: none;
}

#overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.4);
    z-index: 9998;
}

@media (max-width: 768px) {
    .container {
        margin: 20px auto;
        padding: 20px;
    }

    #popup {
        width: 95%;
        height: 75%;
    }

    textarea {
        height: 100px;
    }
}
</style>
</head>
<body>

<div class="container">
    <h1>🎥 YouTube Help</h1>

    <textarea id="query" placeholder="Example: Item Master kaise banaye"></textarea>

    <button onclick="searchYouTube()">Search Video</button>

    <div class="note">
        MARG ERP automatically search me add ho jayega.
    </div>
</div>

<div id="overlay"></div>

<div id="popup">
    <div class="popup-header">
        <button onclick="minimizePopup()">➖</button>
        <button onclick="toggleFullscreen()">⛶</button>
        <button onclick="closePopup()">✖</button>
    </div>
    <iframe id="videoFrame"></iframe>
</div>

<script>
let isFullscreen = false;

function searchYouTube() {
    const q = document.getElementById("query").value.trim();

    if (!q) {
        alert("Please topic likhiye.");
        return;
    }

    const finalQuery = "MARG ERP " + q;
    const url =
        "https://www.youtube.com/results?search_query=" +
        encodeURIComponent(finalQuery);

    document.getElementById("videoFrame").src = url;
    document.getElementById("popup").style.display = "block";
    document.getElementById("overlay").style.display = "block";
}

function closePopup() {
    document.getElementById("popup").style.display = "none";
    document.getElementById("overlay").style.display = "none";
    document.getElementById("videoFrame").src = "";
}

function minimizePopup() {
    document.getElementById("popup").style.display = "none";
    document.getElementById("overlay").style.display = "none";
}

function toggleFullscreen() {
    const popup = document.getElementById("popup");

    if (!isFullscreen) {
        popup.style.width = "100%";
        popup.style.height = "100%";
        popup.style.top = "0";
        popup.style.left = "0";
        popup.style.transform = "none";
        popup.style.borderRadius = "0";
        isFullscreen = true;
    } else {
        popup.style.width = "80%";
        popup.style.height = "70%";
        popup.style.top = "50%";
        popup.style.left = "50%";
        popup.style.transform = "translate(-50%, -50%)";
        popup.style.borderRadius = "12px";
        isFullscreen = false;
    }
}
</script>

</body>
</html>
