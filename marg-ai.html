<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YouTube Help - MARG ERP</title>
<link rel="icon" type="image/png" href="marglogo.png">

<style>
body {
    font-family: Arial, sans-serif;
    background: #f5f7fa;
    margin: 0;
    padding: 20px;
}

.container {
    max-width: 700px;
    margin: 50px auto;
    background: #ffffff;
    padding: 30px;
    border-radius: 15px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.1);
}

h1 {
    text-align: center;
    color: #003366;
    margin-bottom: 25px;
}

textarea {
    width: 100%;
    height: 120px;
    padding: 15px;
    font-size: 18px;
    border: 2px solid #d0d0d0;
    border-radius: 10px;
    box-sizing: border-box;
    resize: vertical;
}

button {
    width: 100%;
    margin-top: 15px;
    padding: 15px;
    font-size: 20px;
    background: #0d6efd;
    color: white;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    background: #0b5ed7;
    transform: scale(1.02);
}

.note {
    margin-top: 15px;
    text-align: center;
    color: #666;
    font-size: 14px;
}

@media (max-width: 768px) {
    body {
        padding: 10px;
    }

    .container {
        margin: 20px auto;
        padding: 20px;
    }

    h1 {
        font-size: 28px;
    }

    textarea {
        height: 100px;
        font-size: 16px;
    }

    button {
        font-size: 18px;
        padding: 14px;
    }
}
</style>
</head>
<body>

<div class="container">
    <h1>🎥 YouTube Help</h1>

    <textarea id="query" placeholder="Example: Item Master kaise banaye"></textarea>

    <button onclick="searchYouTube()">Search Video</button>

    <div class="note">
        MARG ERP automatically search me add ho jayega.
    </div>
</div>

<script>
function searchYouTube() {
    const q = document.getElementById("query").value.trim();

    if (!q) {
        alert("Please topic likhiye.");
        return;
    }

    const finalQuery = "MARG ERP " + q;

    const url =
        "https://www.youtube.com/results?search_query=" +
        encodeURIComponent(finalQuery);

    window.open(url, "_blank");
}
</script>

</body>
</html>
