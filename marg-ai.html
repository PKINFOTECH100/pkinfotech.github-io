<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ask MARG AI - P.K. INFOTECH</title>
<link rel="icon" type="image/png" href="marglogo.png">

<style>
body {
    font-family: Arial, sans-serif;
    background: #f5f7fa;
    margin: 0;
    padding: 20px;
}

.container {
    max-width: 900px;
    margin: auto;
}

.chat-box {
    display: flex;
    flex-direction: column;
    gap: 15px;
    margin-bottom: 20px;
}

.label {
    font-weight: bold;
    margin-bottom: 5px;
    color: #333;
}

.question-box,
.answer-box {
    background: #ffffff;
    border: 1px solid #dcdcdc;
    border-radius: 10px;
    padding: 15px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.08);
}

.answer-box {
    max-height: 400px;
    overflow-y: auto;
    white-space: pre-wrap;
    line-height: 1.6;
}

textarea {
    width: 100%;
    min-height: 80px;
    border: none;
    outline: none;
    resize: vertical;
    font-size: 16px;
    font-family: Arial, sans-serif;
    box-sizing: border-box;
}

button {
    background: #0d6efd;
    color: white;
    border: none;
    padding: 12px 24px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 16px;
    margin-top: 10px;
}

button:hover {
    background: #0b5ed7;
}

.loading {
    color: #666;
    font-style: italic;
}

@media (max-width: 768px) {
    body {
        padding: 10px;
    }

    textarea {
        font-size: 15px;
    }

    button {
        width: 100%;
    }
}
</style>
</head>
<body>

<div class="container">
    <div id="chatContainer"></div>
</div>

<script>
const API_KEY = "AIzaSyDKPZhKusjJHt6NsMo4N6aFxifzCB7dNIRI";
function createChatBlock() {
    const block = document.createElement("div");
    block.className = "chat-box";

    block.innerHTML = `
        <div class="question-box">
            <div class="label">Ask</div>
            <textarea placeholder="MARG software se related question likhen..."></textarea>
            <button>Get Answer</button>
        </div>

        <div class="answer-box" style="display:none;">
            <div class="label">Answer</div>
            <div class="answer-content"></div>
        </div>
    `;

    const textarea = block.querySelector("textarea");
    const button = block.querySelector("button");
    const answerBox = block.querySelector(".answer-box");
    const answerContent = block.querySelector(".answer-content");

    button.addEventListener("click", async () => {
        const question = textarea.value.trim();

        if (!question) {
            alert("Please question likhiye.");
            return;
        }

        button.disabled = true;
        button.textContent = "Loading...";
        answerBox.style.display = "block";
        answerContent.innerHTML = '<div class="loading">Answer aa raha hai...</div>';

        try {
            const prompt = `
You are a MARG ERP software expert.
Answer only MARG software related questions.
If question is not related to MARG software, reply:
"Please MARG software se related question poochhein."

Question: ${question}
`;

            const response = await fetch(
"https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=" + API_KEY,
                {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        contents: [
                            {
                                parts: [
                                    { text: prompt }
                                ]
                            }
                        ]
                    })
                }
            );

            const data = await response.json();

          let answer = JSON.stringify(data, null, 2);

            if (
                data.candidates &&
                data.candidates[0] &&
                data.candidates[0].content &&
                data.candidates[0].content.parts &&
                data.candidates[0].content.parts[0]
            ) {
                answer = data.candidates[0].content.parts[0].text;
            }

            answerContent.textContent = answer;

            // नया Ask/Answer block नीचे जोड़ें
            createChatBlock();

            // नीचे scroll करें
            window.scrollTo({
                top: document.body.scrollHeight,
                behavior: "smooth"
            });

        } catch (error) {
            answerContent.textContent = "Error: " + error.message;
        }

        button.disabled = false;
        button.textContent = "Get Answer";
    });

    document.getElementById("chatContainer").appendChild(block);
}

// पहला Ask/Answer block बनाएँ
createChatBlock();
</script>

</body>
</html>
